name: Build Spot2YTM APK

on:
  push:
    branches: [ "main", "master", "ccr-481d7df3-s8c5zj" ]
    paths: [ "spot2ytm/**", ".github/workflows/build-spot2ytm.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: spot2ytm
        run: gradle assembleDebug

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Spot2YTM-APK
          path: spot2ytm/app/build/outputs/apk/debug/app-debug.apk